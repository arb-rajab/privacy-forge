version: 2
updates:
  # PHP dependencies (root composer.json)
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Inertia 3 is a paired migration: the server adapter (inertia-laravel 3)
      # and the client (@inertiajs/vue3 3) must move together, so a lone bump of
      # either breaks the app. Do it as one deliberate PR.
      - dependency-name: "inertiajs/inertia-laravel"
        update-types: ["version-update:semver-major"]
  # Frontend/JS dependencies (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # eslint-plugin-vue 9 only peers eslint <= 9, so an ESLint 10 bump fails
      # `npm ci` (ERESOLVE). Move eslint and eslint-plugin-vue together.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-vue 10 drops the legacy eslintrc presets
      # (plugin:vue/vue3-recommended), so `npm run lint` fails with the current
      # .eslintrc.cjs. Move to flat config together with eslint 9/10.
      - dependency-name: "eslint-plugin-vue"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 moves the PostCSS plugin to @tailwindcss/postcss and replaces
      # tailwind.config.js; the Vite build fails until that migration is done.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@inertiajs/vue3"
        update-types: ["version-update:semver-major"]
  # Base images in docker/Dockerfile*
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
