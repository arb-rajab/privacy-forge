name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-governance:
    name: Framework version changes require a decision record
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check laravel/framework constraint changes are backed by an ADR or decision-log entry
        # Root cause this guards against (ADR-0008, docs/project-memory/09-decision-log.md,
        # Session 20): a Session 5 commit changed the laravel/framework
        # constraint in composer.json while its own commit message and docs
        # said the opposite ("declined, not applied") — nobody diffed the
        # file against the docs for 14 sessions. This check makes that
        # comparison mechanical instead of relying on a human noticing.
        run: |
          set -euo pipefail
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          if git diff "$BASE"...HEAD -- composer.json | grep -qE '^[+-].*"laravel/framework"[[:space:]]*:'; then
            echo "composer.json changes the laravel/framework constraint in this PR."
            if git diff --name-only "$BASE"...HEAD | grep -qE '^docs/(adr/|project-memory/09-decision-log\.md)'; then
              echo "OK: PR also touches docs/adr/ or the decision log."
            else
              echo "::error::composer.json changes the laravel/framework constraint, but this PR touches neither docs/adr/ nor docs/project-memory/09-decision-log.md. A framework version change must be a recorded decision (see ADR-0008 for why this matters), not a silent side effect. Add an ADR (or a decision-log entry for a smaller change) explaining why before merging."
              exit 1
            fi
          fi

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  php-quality:
    name: PHP lint, static analysis, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: privacy_forge_test
          POSTGRES_USER: privacy_forge
          POSTGRES_PASSWORD: privacy_forge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U privacy_forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, redis, zip
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Lint (Laravel Pint)
        run: composer lint

      - name: Static analysis (Larastan / PHPStan)
        run: composer analyse

      - name: Run migrations (test database)
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: privacy_forge_test
          DB_PASSWORD: privacy_forge_ci
          REDIS_HOST: 127.0.0.1

      - name: Run tests (Pest)
        run: composer test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: privacy_forge_test
          DB_PASSWORD: privacy_forge_ci
          REDIS_HOST: 127.0.0.1

  e2e:
    # This job runs directly on the GitHub-hosted runner (setup-php,
    # setup-node, npx playwright install below) — it never builds or uses
    # docker/Dockerfile at all. So Session 18's runtime/test Dockerfile
    # split (R-07, docs/project-memory/10-risk-register.md — removing
    # Playwright/Chromium from the image `docker compose up` builds and
    # runs) has no effect here one way or the other; noted so a future
    # session doesn't assume this job needs updating to match.
    name: End-to-end (consent widget + DSAR portal, Pest Browser Testing)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: privacy_forge_test
          POSTGRES_USER: privacy_forge
          POSTGRES_PASSWORD: privacy_forge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U privacy_forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, redis, zip, sockets, pcntl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend assets (main app + widget)
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations (test database)
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: privacy_forge_test
          DB_PASSWORD: privacy_forge_ci

      - name: Run end-to-end tests (Pest Browser Testing)
        run: composer test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: privacy_forge_test
          DB_PASSWORD: privacy_forge_ci
          REDIS_HOST: 127.0.0.1

  js-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Vite)
        run: npm run build

  openapi-validate:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: pip install openapi-spec-validator

      - name: Validate docs/architecture/openapi.yaml
        run: python -m openapi_spec_validator docs/architecture/openapi.yaml

  dependency-scan:
    name: Dependency vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            ./

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["javascript"]
        # PHP is not (yet, as of this writing) a first-class CodeQL
        # language on GitHub's standard runner set. Revisit this matrix
        # if/when CodeQL PHP support becomes generally available — noted
        # here rather than silently only scanning JS and calling it done.
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
