openapi: 3.1.0
info:
  title: privacy-forge API
  version: 0.1.0-draft
  description: >
    Consent capture, DSAR, retention, RoPA, and connector-callback API for
    privacy-forge. This is a Session 3 design-time contract — no
    implementation exists yet. Endpoints map to the functional requirements
    in docs/project-memory/02-requirements.md.
  license:
    name: AGPL-3.0

servers:
  - url: https://{instance}/api/v1
    variables:
      instance:
        default: demo.privacy-forge.example

tags:
  - name: Consent
    description: Public consent capture (FR-001..004)
  - name: DSAR Portal
    description: Public data-subject request submission and status (FR-005..011)
  - name: Admin — Purposes and Policies
    description: Staff-only consent purpose, notice, and retention policy management
  - name: Admin — DSAR Queue
    description: >
      Staff-only DSAR visibility, including per-connector task status
      (Session 10 — closes the gap Session 8 left: this was previously
      visible only via direct DB access)
  - name: Admin — ABAC Policies
    description: >
      Staff-only ABAC policy definition management — the policy.update
      sensitive action (ADR-0006), Owner-only (Session 10, closes R-03)
  - name: Admin — RoPA and Audit
    description: Staff-only compliance evidence exports (FR-014, FR-016)
  - name: Connector Callback
    description: Signed, connector-authenticated callback endpoint (ADR-0004)

paths:
  /admin/consent-purposes:
    post:
      tags: [Admin — Purposes and Policies]
      summary: Define a consent purpose and lawful basis (FR-001, US-001)
      security: [{ staffAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentPurposeRequest' }
      responses:
        '201':
          description: Purpose created at version 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentPurpose' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/consent-purposes/{purposeId}:
    delete:
      tags: [Admin — Purposes and Policies]
      summary: >
        Delete a consent purpose. Refused if active consent records
        reference it (US-001) — deprecate instead via status update.
      security: [{ staffAuth: [] }]
      parameters:
        - name: purposeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Purpose deleted (no active consent records referenced it)
        '409':
          description: Refused — active consent records exist; deprecate instead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/consent-purposes/{purposeId}/notices:
    post:
      tags: [Admin — Purposes and Policies]
      summary: Publish a new versioned consent notice for a purpose (FR-002, US-002)
      security: [{ staffAuth: [] }]
      parameters:
        - name: purposeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentNoticeRequest' }
      responses:
        '201':
          description: >
            Notice published as a new version. Previous versions remain
            retrievable and unmodified; existing consent records keep
            referencing the notice version they were shown (never
            silently upgraded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentNotice' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /consent-purposes/{purposeId}/notice:
    get:
      tags: [Consent]
      summary: Get the currently published consent notice for a purpose
      parameters:
        - name: purposeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current notice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentNotice' }
        '404':
          $ref: '#/components/responses/NotFound'

  /consent:
    post:
      tags: [Consent]
      summary: Capture a consent event (FR-003, US-003)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentCaptureRequest' }
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentRecord' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /consent/{consentId}/withdraw:
    post:
      tags: [Consent]
      summary: Withdraw a previously given consent (FR-004, US-004)
      parameters:
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Consent withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentRecord' }
        '404':
          $ref: '#/components/responses/NotFound'

  /dsar:
    post:
      tags: [DSAR Portal]
      summary: Submit a data-subject request (FR-005, US-005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DsarSubmission' }
      responses:
        '201':
          description: Request accepted, pending verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsarStatusToken' }
        '429':
          description: Rate limit exceeded (NFR-006)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /dsar/status/{signedToken}:
    get:
      tags: [DSAR Portal]
      summary: Check DSAR status via a signed, time-limited link (US-005)
      parameters:
        - name: signedToken
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsarStatus' }
        '410':
          description: Link expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /dsar/export/{signedToken}/download:
    get:
      tags: [DSAR Portal]
      summary: Download an export bundle via a signed URL (FR-010, US-008)
      parameters:
        - name: signedToken
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Export bundle (redirect to object storage in practice)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportBundle' }
        '410':
          description: >
            Link expired — TTL never exceeds 72 hours (NFR-007); no
            extension is possible, a new request must be submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/dsar/{dsarId}/verify-identity:
    post:
      tags: [Admin — Purposes and Policies]
      summary: Mark a DSAR's identity as verified (FR-007, US-006)
      security: [{ staffAuth: [] }]
      parameters:
        - name: dsarId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified — evaluated against the dsar.identity.verify policy (ADR-0001)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsarStatus' }
        '403':
          $ref: '#/components/responses/PolicyDenied'

  /admin/dsar/{dsarId}/approve-erasure:
    post:
      tags: [Admin — Purposes and Policies]
      summary: >
        Approve erasure for a verified DSAR. Subject to the separation-of-
        duties policy (ADR-0001): the approver must differ from the
        identity verifier.
      security: [{ staffAuth: [] }]
      parameters:
        - name: dsarId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Approved — dispatch to connectors begins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsarStatus' }
        '403':
          description: >
            Denied by the dsar.erasure.approve policy — most commonly
            because the approver is the same user who verified identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /admin/dsar:
    get:
      tags: [Admin — DSAR Queue]
      summary: >
        List DSARs with their current status and per-connector task
        status (Session 10). Not an ADR-0001 sensitive action — every
        staff role, including Support Staff, "can view DSAR status" per
        the roles matrix — so this is gated by session auth alone, not
        PolicyEvaluator.
      security: [{ staffAuth: [] }]
      responses:
        '200':
          description: DSAR queue, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DsarQueueItem' }

  /admin/policies:
    get:
      tags: [Admin — ABAC Policies]
      summary: >
        List ABAC policy definitions. Gated by the policy.update policy
        (ADR-0006) — viewing and editing share one gate, since ADR-0006
        names exactly one sensitive action for this surface.
      security: [{ staffAuth: [] }]
      responses:
        '200':
          description: All policy definitions (active and superseded)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyDefinition' }
        '403':
          $ref: '#/components/responses/PolicyDenied'

  /admin/policies/{policyId}:
    get:
      tags: [Admin — ABAC Policies]
      summary: View a single ABAC policy definition
      security: [{ staffAuth: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The policy definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDefinition' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin — ABAC Policies]
      summary: >
        Update a policy definition (FR-013, ADR-0006). Policies are
        versioned rows (04-data-model.md): this supersedes the current
        row and creates the next version rather than mutating in place —
        the same pattern already used for consent notices.
      security: [{ staffAuth: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyDefinitionUpdateRequest' }
      responses:
        '200':
          description: Superseded — the new version is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDefinition' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/data-categories:
    get:
      tags: [Admin — Purposes and Policies]
      summary: >
        List data categories (US-010). Gated by the retention.policy.manage
        policy (Session 11) — viewing and editing share one gate, the same
        reasoning ADR-0006 established for policy.update.
      security: [{ staffAuth: [] }]
      responses:
        '200':
          description: All data categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DataCategory' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
    post:
      tags: [Admin — Purposes and Policies]
      summary: Define a data category (US-010)
      security: [{ staffAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataCategoryRequest' }
      responses:
        '201':
          description: Data category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataCategory' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/retention-policies:
    get:
      tags: [Admin — Purposes and Policies]
      summary: List retention policies (all versions), gated by retention.policy.manage
      security: [{ staffAuth: [] }]
      responses:
        '200':
          description: All retention policies (active and deprecated versions)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RetentionPolicy' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
    post:
      tags: [Admin — Purposes and Policies]
      summary: >
        Define a retention policy for a data category (FR-012, US-010).
        Saved and versioned at version 1.
      security: [{ staffAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPolicyRequest' }
      responses:
        '201':
          description: Retention policy created at version 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/retention-policies/{policyId}:
    get:
      tags: [Admin — Purposes and Policies]
      summary: View a single retention policy
      security: [{ staffAuth: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The retention policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin — Purposes and Policies]
      summary: >
        Update a retention policy (FR-012, US-010). Retention policies are
        versioned rows (04-data-model.md): this supersedes the current
        row and creates the next version rather than mutating in place —
        the same pattern already used for consent notices and ABAC policy
        definitions. The governed data category cannot change across
        versions.
      security: [{ staffAuth: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPolicyUpdateRequest' }
      responses:
        '200':
          description: Superseded — the new version is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/retention-policies/{policyId}/dry-run:
    post:
      tags: [Admin — Purposes and Policies]
      summary: >
        Preview a retention policy with no side effects (FR-012, US-011).
        Selection uses the same RetentionSelector query real execution
        uses (ADR-0002) — the returned affected_record_count and a
        subsequent real run's affected count are guaranteed identical
        given unchanged data.
      security: [{ staffAuth: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Preview report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPreview' }
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/ropa/export:
    get:
      tags: [Admin — RoPA and Audit]
      summary: Export the Record of Processing Activities (FR-016, US-013)
      security: [{ staffAuth: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [pdf, csv], default: pdf }
      responses:
        '200':
          description: RoPA document
          content:
            application/pdf: {}
            text/csv: {}

  /admin/audit-log:
    get:
      tags: [Admin — RoPA and Audit]
      summary: Query the tamper-evident audit log (FR-014, NFR-009)
      security: [{ staffAuth: [] }]
      parameters:
        - name: resourceType
          in: query
          schema: { type: string }
        - name: resourceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Matching entries, in chain order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogEntry' }

  /connector-callback/{taskId}:
    post:
      tags: [Connector Callback]
      summary: >
        Connector reports the result of an export/erasure task (ADR-0004).
        Authenticated via a connector-specific signed credential, distinct
        from staff authentication.
      security: [{ connectorAuth: [] }]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorCallback' }
      responses:
        '200':
          description: Callback accepted
        '401':
          description: Invalid or missing connector signature

components:
  securitySchemes:
    staffAuth:
      type: apiKey
      in: cookie
      name: privacy_forge_session
      description: Session-based auth for staff users (see 06-security-threat-model.md, Session 4)
    connectorAuth:
      type: apiKey
      in: header
      name: X-Connector-Signature
      description: HMAC signature over the request body + timestamp, per ADR-0004

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ValidationError:
      description: Field-level validation failure (FR-003 requires no partial record on error)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PolicyDenied:
      description: Denied by ABAC policy evaluation (ADR-0001) — response includes the policy_id that denied it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        policy_id:
          type: string
          format: uuid
          description: Present when status is 403 and the denial came from ABAC evaluation (ADR-0001)

    ConsentPurposeRequest:
      type: object
      required: [name, lawful_basis]
      properties:
        name: { type: string }
        description: { type: string }
        lawful_basis:
          type: string
          enum: [consent, contract, legal_obligation, vital_interests, public_task, legitimate_interests]

    ConsentPurpose:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        lawful_basis:
          type: string
          enum: [consent, contract, legal_obligation, vital_interests, public_task, legitimate_interests]
        status: { type: string, enum: [active, deprecated] }
        version: { type: integer }

    ConsentNoticeRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }

    ConsentNotice:
      type: object
      properties:
        purpose_id: { type: string, format: uuid }
        version: { type: integer }
        body: { type: string }
        published_at: { type: string, format: date-time }

    ConsentCaptureRequest:
      type: object
      required: [purpose_id, notice_version, subject_identifier]
      properties:
        purpose_id: { type: string, format: uuid }
        notice_version: { type: integer }
        subject_identifier: { type: string }

    ConsentRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose_id: { type: string, format: uuid }
        notice_version: { type: integer }
        status: { type: string, enum: [active, withdrawn] }
        given_at: { type: string, format: date-time }
        withdrawn_at: { type: string, format: date-time, nullable: true }

    DsarSubmission:
      type: object
      required: [request_type, subject_identifier]
      properties:
        request_type: { type: string, enum: [access, export, erasure] }
        subject_identifier: { type: string }

    DsarStatusToken:
      type: object
      properties:
        status_url: { type: string, format: uri }
        status: { type: string, enum: [pending_verification] }

    DsarStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        request_type: { type: string, enum: [access, export, erasure] }
        status:
          type: string
          enum: [pending_verification, in_progress, partially_complete, complete, rejected]
        export_bundles:
          type: array
          description: >
            Session 10 — how a data subject learns their export is ready,
            via the same status link they already hold. Empty until at
            least one unexpired bundle exists (US-008).
          items: { $ref: '#/components/schemas/ExportBundle' }
        deletion_certificate:
          description: >
            Session 10 — how a data subject learns their erasure is
            complete (US-009). Null until issued.
          oneOf:
            - { $ref: '#/components/schemas/DeletionCertificateSummary' }
            - type: 'null'

    ExportBundle:
      type: object
      properties:
        format: { type: string, enum: [json, csv] }
        download_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    DeletionCertificateSummary:
      type: object
      properties:
        issued_at: { type: string, format: date-time }
        summary: { type: string }
        exceptions:
          type: string
          nullable: true
          description: >
            Null when every connector confirmed erasure; otherwise names
            which connector(s) could not confirm (FR-011 — never
            overstate what was achieved).

    DsarQueueItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        request_type: { type: string, enum: [access, export, erasure] }
        status:
          type: string
          enum: [pending_verification, in_progress, partially_complete, complete, rejected]
        identity_verified_by: { type: string, format: uuid, nullable: true }
        identity_verified_at: { type: string, format: date-time, nullable: true }
        erasure_approved_by: { type: string, format: uuid, nullable: true }
        erasure_approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/DsarConnectorTaskStatus' }

    DsarConnectorTaskStatus:
      type: object
      properties:
        connector_id: { type: string, format: uuid }
        connector_name: { type: string }
        task_type: { type: string, enum: [export, erasure] }
        status: { type: string, enum: [pending, success, failed, partial] }
        attempt_count: { type: integer }
        failure_reason: { type: string, nullable: true }
        dispatched_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    PolicyDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        action_name: { type: string }
        version: { type: integer }
        subject_conditions: { type: object, additionalProperties: true }
        resource_conditions: { type: object, additionalProperties: true }
        environment_conditions: { type: object, additionalProperties: true }
        effect: { type: string, enum: [allow, deny] }
        status: { type: string, enum: [active, superseded] }

    PolicyDefinitionUpdateRequest:
      type: object
      required: [effect]
      properties:
        subject_conditions: { type: object, additionalProperties: true, nullable: true }
        resource_conditions: { type: object, additionalProperties: true, nullable: true }
        environment_conditions: { type: object, additionalProperties: true, nullable: true }
        effect: { type: string, enum: [allow, deny] }

    DataCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        sensitivity: { type: string, enum: [standard, elevated, special_category] }
        subject_table:
          type: string
          enum: [consent_records, dsar_requests]
          description: >
            Which of this instance's own tables a governing RetentionPolicy
            applies to. Deliberately excludes audit_log_entries and
            deletion_certificates — those are evidentiary records with
            their own indefinite retention (03-architecture.md, Backup and
            Recovery), never a retention-policy target.

    DataCategoryRequest:
      type: object
      required: [name, sensitivity, subject_table]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        sensitivity: { type: string, enum: [standard, elevated, special_category] }
        subject_table: { type: string, enum: [consent_records, dsar_requests] }

    RetentionPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        data_category_id: { type: string, format: uuid }
        retention_period_days: { type: integer }
        post_expiry_action: { type: string, enum: [erase, anonymise] }
        status: { type: string, enum: [active, deprecated] }
        version: { type: integer }

    RetentionPolicyRequest:
      type: object
      required: [data_category_id, retention_period_days, post_expiry_action]
      properties:
        data_category_id: { type: string, format: uuid }
        retention_period_days: { type: integer, minimum: 1 }
        post_expiry_action: { type: string, enum: [erase, anonymise] }

    RetentionPolicyUpdateRequest:
      type: object
      required: [retention_period_days, post_expiry_action]
      properties:
        retention_period_days: { type: integer, minimum: 1 }
        post_expiry_action: { type: string, enum: [erase, anonymise] }

    RetentionPreview:
      type: object
      properties:
        policy_id: { type: string, format: uuid }
        affected_record_count: { type: integer }
        sample_record_ids:
          type: array
          items: { type: string, format: uuid }
          description: A sample, not necessarily exhaustive for very large sets

    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: string, enum: [staff, connector, system] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, format: uuid }
        policy_id: { type: string, format: uuid, nullable: true }
        decision: { type: string, enum: [allow, deny] }
        reason_code:
          type: string
          nullable: true
          description: >
            Set on denials — either fail-closed (policy_missing,
            evaluation_error; ADR-0006) or an ordinary, correctly-evaluated
            denial (policy_conditions_not_met), distinguishing the two.
        entry_hash: { type: string }
        created_at: { type: string, format: date-time }

    ConnectorCallback:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [success, failed, partial] }
        failure_reason: { type: string, nullable: true }
